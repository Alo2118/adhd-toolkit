<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ADHD Toolkit</title>
  <meta name="description" content="Strumenti rapidi per cervelli ADHD in sovraccarico.">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="src/styles/base.css">
  <link rel="stylesheet" href="src/styles/variables.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <link rel="stylesheet" href="src/styles/screens.css">
  <link rel="stylesheet" href="src/styles/wizard.css">
  <link rel="stylesheet" href="src/styles/onboarding.css">
  <link rel="stylesheet" href="src/styles/tools.css">

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    /* Minimal layout for SPA container */
    #app {
      width: 100%;
      height: 100%;
      overflow-y: auto;
    }
    

    #modal-container {
      z-index: 1000;
      position: relative;
    }
  </style>
</head>

<body>
  <div id="app">
    <!-- Content injected by src/main.js -->
    <div class="legal-screen" style="display:flex;align-items:center;justify-content:center;height:100vh;">
      <p>Caricamento...</p>
    </div>
  </div>
  <div id="modal-container"></div>
  <div class="toast" id="toast"></div>

  <script type="module" src="src/main.js"></script>
  <!-- Update Banner (hidden by default) -->
  <div id="update-banner" class="update-banner" style="display:none">
    <div class="update-banner-content">
      <span class="update-banner-icon">🚀</span>
      <span class="update-banner-text">Nuova versione disponibile!</span>
      <button class="update-banner-btn" onclick="location.reload()">Aggiorna</button>
      <button class="update-banner-close" onclick="dismissUpdateBanner()">&times;</button>
    </div>
  </div>

  <script>
    // PWA Registration & Update Detection
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(reg => {
        console.log('SW registrato:', reg);

        // Check for updates on app open (register already triggers a check)

        // Detect new SW waiting or installing
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          if (!newWorker) return;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              // New version installed, waiting to activate
              showUpdateBanner();
            }
          });
        });
      }).catch(err => console.log('SW errore:', err));

      // Listen for messages from SW (post-activation notification)
      navigator.serviceWorker.addEventListener('message', event => {
        if (event.data?.type === 'SW_UPDATED') {
          showUpdateBanner();
        }
        if (event.data?.type === 'SW_VERSION') {
          const el = document.getElementById('appVersionValue');
          if (el) el.textContent = event.data.version;
        }
      });

      // If controller changes (new SW took over), reload for fresh content
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        location.reload();
      });
    }

    function showUpdateBanner() {
      const banner = document.getElementById('update-banner');
      if (banner) banner.style.display = 'flex';
    }

    function dismissUpdateBanner() {
      const banner = document.getElementById('update-banner');
      if (banner) banner.style.display = 'none';
    }
  </script>
</body>

</html>
